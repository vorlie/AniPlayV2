name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/pages.yml'
      - 'website/**'
      - 'docs/**'
      - 'mkdocs.yml'
      - 'ani-cli-gui/build/icon.png'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install MkDocs & Build Docs
        run: |
          # `mkdocs-material` bundles the theme and `pymdown-extensions`,
          # both of which are required because `mkdocs.yml` enables
          # admonitions, attr_list, def_list, footnotes, md_in_html,
          # pymdownx.details, pymdownx.highlight, pymdownx.inlinehilite,
          # pymdownx.snippets, pymdownx.superfences, pymdownx.tabbed,
          # pymdownx.tasklist, pymdownx.tilde and pymdownx.caret.
          python -m pip install --upgrade pip
          python -m pip install "mkdocs-material>=9.5" "pymdown-extensions>=10"

      - name: Build documentation site
        run: mkdocs build --site-dir website/dist/docs

      - name: Build main static site
        # This script rebuilds the marketing site on top of the same
        # `website/dist/` directory while preserving the `docs/` subfolder
        # produced by the MkDocs step above.
        run: node website/build.mjs

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4